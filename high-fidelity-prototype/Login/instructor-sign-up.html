    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <a class="navbar-brand fw-bold" href="#">
      MicroCourse
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
            data-bs-target="#navbarNav" aria-controls="navbarNav" 
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="signup-learner.html">

<div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 450p;">
        <h3 class="text-center mb-4">Instructor Sign Up</h3>

        <form>
            <div class="mb-3">
                <label class="form-label">First Name:</label>
                <input type="text" class="form-control">
            </div>

             <div class="mb-3">
                <label class="form-label">Last Name:</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="instructor@example.com">
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <label type="password" class="form-control"></label>
            </div>

            <div class="mb-3">
                <label class="form-control">Expertises</label>
                <input type="text" class="form-control" placeholder="Web Development, Software Engineer">
            </div>

            <a href="/high-fidelity-prototype/Provider/provider.html">Sign Up</a>
            <div class="text-center mt-3">
                    <small>Registering as a learner?</small><br>
                    <a href="/high-fidelity-prototype/Login/customer-sign-up.html" class="text-primary">Click here</a>
                </div>
        </form>
    </div>
