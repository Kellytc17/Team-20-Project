<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instructor Login - MicroCourse</title>

    <!-- Everything made with Bootstrap :) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">

            <div class="row justify-content-center">

                <div class="col-md-6 col-lg-5">

                    <div class="card shadow-sm">
                        <div class="card-body p-4">

                            <div class="text-center mb-4">
                                <h2 class="fw-bold">
                                    Instructor Login
                                </h2>

                                <p class="text-muted">
                                    Sign in to manage your courses.
                                </p>
                            </div>

                            <form onsubmit="loginInstructor(event)">

                                <div class="mb-3">
                                    <label for="email" class="form-label">
                                        Email
                                    </label>

                                    <input type="email"
                                           class="form-control"
                                           id="email"
                                           value="Youremail@gmail.com"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">
                                        Password
                                    </label>

                                    <input type="password"
                                           class="form-control"
                                           id="password"
                                           value="password123"
                                           required>
                                </div>

                                <div class="d-grid">
                                    <button type="submit"
                                            class="btn btn-primary">
                                        Login
                                    </button>
                                </div>

                            </form>

                            <hr class="my-4">

                            <div class="text-center">

                                <p class="mb-2">
                                    Don't have an account?
                                    <a href="instructor-sign-up.html">
                                        Sign up as an instructor
                                    </a>
                                </p>

                                <p class="mb-0">
                                    Not an instructor?
                                    <a href="Learner-login.html">
                                        Login as a learner
                                    </a>
                                </p>

                            </div>

                        </div>
                    </div>

                </div>

            </div>

        </div>
    </main>

    <footer class="py-4 bg-dark text-white">
        <div class="container">

            <div class="text-center">

                <h5 class="fw-bold">
                    MicroCourse
                </h5>

                <p class="text-white-50 mb-2">
                    Bite-sized learning made simple.
                </p>

                <p class="text-white-50 mb-0">
                    &copy; 2026 MicroCourse. All rights reserved.
                </p>

            </div>

        </div>
    </footer>

    <script>
        function loginInstructor(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if (email === "Youremail@gmail.com" && password === "password123") {

                localStorage.setItem("instructorLoggedIn", "true");

                window.location.href = "../provider/provider.html";

            } else {

                alert("Incorrect email or password.");

            }
        }
    </script>

</body>
</html>
