<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro Course | Learner Sign-Up</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4 mx-auto" style="max-width: 450px;">
            <h3 class="text-center mb-4">Customer Sign Up</h3>

            <form>
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" placeholder="John Doe">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" placeholder="customer@example.com">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control">
                </div>
            
               

                <a href="/high-fidelity-prototype/customer/customerProfile.html">Sign-Up</a>

                 <div class="text-center mt-3">
                    <small>Registering as an instructor?</small><br>
                    <a href="signup-instructor.html" class="text-primary">Click here</a>
                </div>
            </form>

        </div>
    </div>
</body>
</html>
