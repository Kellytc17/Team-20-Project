<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Learner Login - MicroCourse</title>

    <!-- Everything made with Bootstrap :) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">

    <a class="navbar-brand fw-bold" href="/high-fidelity-prototype/index.html">
      MicroCourse
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
            data-bs-target="#navbarNav" aria-controls="navbarNav" 
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="signup-learner.html">
            Sign Up
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="learner-profile.html">
            Profile
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="learner-courses.html">
            Courses
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">
            About
          </a>
        </li>

      </ul>
    </div>

  </div>
</nav>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">

            <div class="row justify-content-center">

                <div class="col-md-6 col-lg-5">

                    <div class="card shadow-sm">
                        <div class="card-body p-4">

                            <div class="text-center mb-4">
                                <h2 class="fw-bold">
                                    Learner Login
                                </h2>

                                <p class="text-muted">
                                    Sign in to continue learning.
                                </p>
                            </div>

                            <form onsubmit="loginLearner(event)">

                                <div class="mb-3">
                                    <label for="email" class="form-label">
                                        Email
                                    </label>

                                    <input type="email"
                                           class="form-control"
                                           id="email"
                                           value="Youremail@gmail.com"
                                           required>

                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">
                                        Password
                                    </label>

                                    <input type="password"
                                           class="form-control"
                                           id="password"
                                           value="password123"
                                           required>

                                </div>

                                <div class="d-grid">
                                    <button type="submit"
                                            class="btn btn-primary" >
                                        Login    
                                    </button>
                                </div>

                            </form>

                            <hr class="my-4">

                            <div class="text-center">

                                <p class="mb-2">
                                    Don't have an account?
                                    <a href="customer-sign-up.html">
                                        Sign up as a learner
                                    </a>
                                </p>

                                <p class="mb-0">
                                    Not a learner?
                                    <a href="Instructor-login.html">
                                        Login as an instructor
                                    </a>
                                </p>

                            </div>

                        </div>
                    </div>

                </div>

            </div>

        </div>
    </main>

    <footer class="py-4 bg-dark text-white">
        <div class="container">

            <div class="text-center">

                <h5 class="fw-bold">
                    MicroCourse
                </h5>

                <p class="text-white-50 mb-2">
                    Bite-sized learning made simple.
                </p>

                <p class="text-white-50 mb-0">
                    &copy; 2026 MicroCourse. All rights reserved.
                </p>

            </div>

        </div>
    </footer>

<script>
    function loginLearner(event) {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (email === "Youremail@gmail.com" && password === "password123") {

            localStorage.setItem("learnerLoggedIn", "true");

            window.location.href = "../Customer/customerProfile.html";

        } else {

            alert("Incorrect email or password.");

        }
    }
</script>

</body>
</html>
